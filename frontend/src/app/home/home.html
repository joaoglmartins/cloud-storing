<div class="home">
    <div class="input-name">
        <input type="text" placeholder="File name" [(ngModel)]="fileName">
        <input type="file" name="file" id="fileInput" (change)="onFileChange($event)">
        <button (click)="addFile()">Add file</button>
    </div>
    <div class="files">
        <div class="file-container" *ngFor="let file of files">
            <p>{{ file.name }}</p>
            <p>{{ file.size }} bytes</p>
            <p>{{ file.lastModified | date:'short' }}</p>
            <a (click)="onDownload(file)">Download</a>
        </div>
</div>
